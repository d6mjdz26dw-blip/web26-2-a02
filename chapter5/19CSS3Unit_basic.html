<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>3. css3 단위</title>
    <style> 
        p:nth-child(1){}
        p:nth-child(2){ font-size: 100%}
        p:nth-child(3){ font-size: 150%}
        p:nth-child(4){ font-size: 200%}

/*3. em단위 적용하기: 배수를 나타내는 단위.
1배 = 1em =100%
1.5배 = 1.5em = 150%
          p:nth-child(1){}
        p:nth-child(2){ font-size: 1.0em}
        p:nth-child(3){ font-size: 1.5em}
        p:nth-child(4){ font-size: 2.0em}*/

        p:nth-child(1){}
        p:nth-child(2){ font-size:16px}
        p:nth-child(3){ font-size:24px}
        p:nth-child(4){ font-size:32px}

        /*색상 단위*/
        h1{background-color: rgb(255,255,0);}
        h2{background-color: rgba(255,0,0,0.5);}/*rgba색상: 알파값은 투명도. 0완전투명, 1.0 완전 불투명상태*/
        h3{background-color:#0094ff;}/*hex코드: rgb색상 단위를 짧게 입력하는 방법.*/

    </style>
</head>
