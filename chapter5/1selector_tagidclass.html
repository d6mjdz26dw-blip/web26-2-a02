<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>css3 selector basic</title>
    <style>
        #header{
            width:800px; margin: 0 auto;
            background: red;
        }
        #wrap{
             width:800px; margin: 0 auto;
            overflow: hidden;
        }
        #aside{
            width: 200px; float: left;
            background: blue;
        }
        #content{
            width:600px; float: left;
            background: green;
        }
        #rint{
            color: aqua;
        }
        .select{color: red;}
        .header{background-color: blue}
       
    </style>
</head>

<body>
    <h2 >1. 전체 선택자</h2>
    <h2 id="rint">2. 태그 선택자</h2>
    <h2 id="rint">3. 아이디 선택자</h2>
    <h2 >4. id속성을 중족 사용하면 해당 id속성을 표시한다</h2>
    <hr>

    <h1>제목 글자</h1>
    <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit.</p>
    <p>Ab adipisici</p>

    <ul>
        <li class="select">사과</li>
        <li>바나나</li>
        <li>오렌지</li>
        <li>감</li>
    </ul>
</body>
</html>
